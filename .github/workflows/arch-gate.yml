name: Architecture Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: arch-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arch-gate:
    name: 架构约束
    runs-on: ubuntu-latest
    # 关键：从仓库根执行。ARCH009 需要同时看到 frontend/ 和 backend/，
    # 若 working-directory 设为 backend，root/frontend 不存在 -> 静默 return -> 恒为 0。
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 检查器是纯 AST 分析，不需要安装项目依赖
      - name: 检查器自检
        run: python backend/tests/architecture/selftest.py

      - name: 架构约束校验（棘轮）
        run: python backend/tests/architecture/arch_rules.py --root . --baseline backend/arch_baseline.json
